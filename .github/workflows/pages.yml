name: Benchmark website

on:
  push:
    branches: [main]
    paths:
      - 'benchmark/**'
      - 'configs/**'
      - 'data/**'
      - 'results/**'
      - 'docs/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.python-version'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'benchmark/**'
      - 'configs/**'
      - 'data/**'
      - 'results/**'
      - 'docs/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.python-version'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install locked environment
        run: |
          python -m pip install uv
          uv sync --locked --dev
      - name: Test
        run: uv run --no-sync pytest
      - name: Generate website and reference overlays
        run: uv run --no-sync python -m benchmark.docs
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

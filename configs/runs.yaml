# Add a new ID when changing settings or repeating a completed run.
# null seeds were not recorded for existing results. New runs require an integer seed.

run_a:
  sampler: dynesty
  seed: null
  status: imported
  purpose: Fiducial
  kwargs: {nlive: 4000, bound: live, sample: rwalk, update_interval: 600, walks: 100, facc: 0.2, dlogz: 0.1,
      add_live: true, nact: 20, maxmcmc: 5000, naccept: 10}

run_b:
  sampler: dynesty
  seed: 42
  status: planned
  purpose: Cheap
  kwargs: {nlive: 1000, sample: act-walk, nact: 2, bound: live, dlogz: 0.5, add_live: true, update_interval: 600,
      walks: 100, facc: 0.2, maxmcmc: 5000, naccept: 60, proposals: [diff, volumetric], check_point_delta_t: 1800,
      check_point_plot: true}

run_c:
  sampler: dynesty
  seed: 42
  status: planned
  purpose: Cheap
  kwargs: {nlive: 500, sample: act-walk, nact: 2, bound: live, dlogz: 0.5, add_live: true, update_interval: 600,
      walks: 100, facc: 0.2, maxmcmc: 5000, naccept: 60, proposals: [diff, volumetric], check_point_delta_t: 1800,
      check_point_plot: true}


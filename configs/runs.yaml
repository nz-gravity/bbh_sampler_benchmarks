  kwargs: {nlive: 250, sample: act-walk, nact: 2, bound: live, dlogz: 0.5, add_live: true, update_interval: 600,
      walks: 100, facc: 0.2, maxmcmc: 5000, naccept: 60, proposals: [diff, volumetric], check_point_delta_t: 1800,
      check_point_plot: true}

run_e:
  sampler: dynesty
  seed: 42
  status: planned
  purpose: Alternative exploration
  kwargs: {nlive: 500, sample: rslice, slices: 3, bound: multi, dlogz: 0.5, add_live: true, update_interval: 600,
      walks: 100, facc: 0.2, check_point_delta_t: 1800, check_point_plot: true}

run_f:
  sampler: bilby_mcmc
  seed: null
  status: imported
  purpose: Existing sampler result
  kwargs: {nsamples: 2000, nensemble: 1, pt_ensemble: false, ntemps: 8, Tmax_from_SNR: 20, adapt: true, adapt_t0: 100,
      adapt_nu: 10, pt_rejection_sample: false, burn_in_nact: 10, thin_by_nact: 0.2, fixed_discard: 0,
